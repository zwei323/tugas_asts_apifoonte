<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Siswa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }

        h1 {
            margin-top: 0;
            color: #18243d;
        }

        p {
            color: #64748b;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #18243d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🎓 Login Siswa</h1>

    <p>
        Silakan login menggunakan email dan password.
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register">
        Belum punya akun?
        <a href="daftar.html">
            Daftar sekarang
        </a>
    </div>

</div>


<script>

const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    button.disabled = true;
    button.textContent = "Login...";

    message.className = "message";
    message.textContent = "";


    const formData = new FormData();

    formData.append(
        "email",
        document.getElementById("email").value.trim()
    );

    formData.append(
        "password",
        document.getElementById("password").value
    );


    try {

        const response = await fetch(
            "login_siswa.php",
            {
                method: "POST",
                body: formData
            }
        );


        const text =
            await response.text();

        console.log(text);


        const data =
            JSON.parse(text);


        if (data.status === "success") {

            window.location.href =
                "dashboard_siswa.php";

        } else {

            message.className =
                "message error";

            message.textContent =
                data.message;
        }

    } catch (error) {

        message.className =
            "message error";

        message.textContent =
            "Terjadi kesalahan pada server.";
    }


    button.disabled = false;
    button.textContent = "Login";

});

</script>

</body>
</html>
